name: ci-cd.yml # 작업 이름

on:  # 어느 시점에 해당 작업이 동작할지 설정
  push:
    branches: [main] # main 브랜치에 푸시 할때 동작 PR은 검증이 안된코드라 X

permissions:
  id-token: write
  contents: read

jobs:                       # 작업 정의
  build:
    runs-on: ubuntu-latest  # Runner 환경
    outputs:
      image_tag: ${{ steps.vars.outputs.short_sha }}

    steps:                  # 실행할 단계들
      - name: Checkout code
        uses: actions/checkout@v4     # 미리 만들어진 Action 사용 , GitHub Marketplace에 있는 기능을 실행  checkout 이라는 기능 4버전을 사용해라

      - name: Set short SHA
        id: vars
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v4
        with:                          # Action에 전달할 옵션
          java-version: '17'
          distribution: 'corretto'

      # Step 3: Gradle 캐시
      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run tests # 작업 이름
        run: ./gradlew test # 작업 내용

      - name: Build JAR
        run: ./gradlew bootJar  # jar 파일 생성

      - name: Login to DockerHub
        uses: docker/login-action@v4 #https://github.com/docker/login-action 에서 버전 확인가능
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}  #Docker Hub의 사용자 ID
          password: ${{ secrets.DOCKERHUB_TOKEN }}  #Docker Hub에서 발급 받은 사용자 Token

      #SHORT_SHA 와 IMAGE_URI 선언 -> docker build 로 이미지 생성 docker push로 이미지 hub에 등록
      - name: build and push Docker image to docker hub
        run: |
          SHORT_SHA=${{ steps.vars.outputs.short_sha }}
          IMAGE_URI=${{ vars.DOCKERHUB_USERNAME }}/cloudarchi
          
          docker build --platform linux/arm64 -t $IMAGE_URI:$SHORT_SHA .
          
          docker push $IMAGE_URI:$SHORT_SHA
          
          echo "✅ Pushed: $IMAGE_URI:$SHORT_SHA"

  # aws ssm send-command ssm 커멘드를 넣겠다 선언 vars.EC2_INSTANCE_ID 로 인스턴스 아이디 가져옴
  # SSM이 사용할 명령 실행 방식을 지정 | 실제로 EC2 안에서 실행할 명령 목록 시작
  # docker pull 이미지 가져오기 docker stop 기존 컨테이너 중지 docker rm 제거 docker run 실행
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update Launch Template
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          LAUNCH_TEMPLATE_ID: ${{ vars.LAUNCH_TEMPLATE_ID }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          USER_DATA=$(cat <<'USERDATA' | sed "s|__IMAGE_TAG__|${IMAGE_TAG}|g; s|__DOCKERHUB_USERNAME__|${DOCKERHUB_USERNAME}|g" | base64 -w 0
          #!/bin/bash
          set -e
  
          DOCKERHUB_USERNAME="__DOCKERHUB_USERNAME__"
          IMAGE_NAME="cloudarchi"
          IMAGE_TAG="__IMAGE_TAG__"
          CONTAINER_NAME="myapp"
  
          IMAGE_URI="${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG}"
  
          dnf update -y
          dnf install -y docker
          systemctl enable docker
          systemctl start docker
  
          until docker info > /dev/null 2>&1; do
            sleep 2
          done
  
          docker stop ${CONTAINER_NAME} || true
          docker rm ${CONTAINER_NAME} || true
  
          docker pull ${IMAGE_URI}
  
          docker run -d \
            -p 8080:8080 \
            --restart unless-stopped \
            --name ${CONTAINER_NAME} \
            -e SPRING_PROFILES_ACTIVE=prod \
            ${IMAGE_URI}
          USERDATA
          )
  
          NEW_VERSION=$(aws ec2 create-launch-template-version \
            --launch-template-id ${LAUNCH_TEMPLATE_ID} \
            --source-version '$Latest' \
            --launch-template-data "{\"UserData\":\"${USER_DATA}\"}" \
            --query 'LaunchTemplateVersion.VersionNumber' \
            --output text)
  
          echo "LaunchTemplate v${NEW_VERSION} 생성 완료"
  
          aws ec2 modify-launch-template \
            --launch-template-id ${LAUNCH_TEMPLATE_ID} \
            --default-version ${NEW_VERSION}
  
          echo "기존 → v${NEW_VERSION} 변경 완료"

      - name: Start Instance Refresh
        id: refresh
        env:
          ASG_NAME: ${{ vars.ASG_NAME }}
        run: |
          EXISTING_ID=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name "$ASG_NAME" \
            --query "InstanceRefreshes[?Status=='Pending' || Status=='InProgress'] | [0].InstanceRefreshId" \
            --output text)
          
          if [ "$EXISTING_ID" != "None" ] && [ -n "$EXISTING_ID" ]; then
            echo "이미 진행 중인 Instance Refresh 발견: $EXISTING_ID"
            echo "refresh_id=$EXISTING_ID" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences '{"MinHealthyPercentage":100,"InstanceWarmup":120}' \
            --query 'InstanceRefreshId' \
            --output text)
          
          echo "새 Instance Refresh 시작: $REFRESH_ID"
          echo "refresh_id=$REFRESH_ID" >> $GITHUB_OUTPUT
          
      - name: Wait for Instance Refresh
        env:
          ASG_NAME: ${{ vars.ASG_NAME }}
          REFRESH_ID: ${{ steps.refresh.outputs.refresh_id }}
        run: |
          echo "⏳ Instance Refresh 완료 대기 중..."

          for i in $(seq 1 30); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query 'InstanceRefreshes[0].Status' \
              --output text)

            echo "시도 ${i}/30 - 상태: ${STATUS}"

            if [ "$STATUS" = "Successful" ]; then
              echo "Instance Refresh 성공"
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "Instance Refresh 실패: $STATUS"
              exit 1
            fi

            sleep 30
          done

          echo "Instance Refresh 타임아웃"
          exit 1